apply plugin: 'com.android.application'

android {
    namespace 'ru.pressurediary.app'
    compileSdk 36

    defaultConfig {
        applicationId 'ru.pressurediary.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
